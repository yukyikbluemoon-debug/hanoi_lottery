name: daily-update
on:
  schedule:
    - cron: "45 9 * * *"   # 16:45 ไทย (หลังเฉพาะกิจ/กาชาด)
    - cron: "45 10 * * *"  # 17:45 ไทย (หลังสามัคคี)
    - cron: "45 11 * * *"  # 18:45 ไทย (หลังปกติ)
    - cron: "45 12 * * *"  # 19:45 ไทย (หลัง VIP)
    - cron: "45 13 * * *"  # 20:45 ไทย (สำรอง)
    - cron: "0 14 * * *"   # 21:00 ไทย
    - cron: "0 16 * * *"   # 23:00 ไทย (สำรอง)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test parser
        run: python scripts/daily.py --selftest
      - name: Update data
        run: python scripts/daily.py
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(date -u +%F)"
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push rejected (attempt $i): sync with remote and redo update"
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/daily.py || true
            git add data/
            git diff --cached --quiet && exit 0
            git commit -q -m "Update data $(date -u +%F)"
            sleep $((RANDOM % 8 + 2))
          done
          exit 1
