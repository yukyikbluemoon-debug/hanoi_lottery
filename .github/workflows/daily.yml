name: daily-update
on:
  schedule:
    - cron: "0 14 * * *"   # 21:00 ไทย
    - cron: "0 16 * * *"   # 23:00 ไทย (สำรอง)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test parser
        run: python scripts/daily.py --selftest
      - name: Update data
        run: python scripts/daily.py
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hanoi_lottery.csv
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)
