name: audit-normal
on:
  workflow_dispatch:
    inputs:
      years:
        description: "ปีที่ตรวจ คั่นด้วยจุลภาค เช่น 2016,2026 (ว่าง = ทุกปี 2002-2026)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.p.outputs.years }}
    steps:
      - id: p
        run: |
          Y="${{ github.event.inputs.years }}"
          if [ -z "$Y" ]; then Y=$(seq -s, 2002 2026); fi
          echo "years=$(echo "$Y" | tr -d ' ' | awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s%s",(i>1?",":""),$i}; printf "]"}')" >> "$GITHUB_OUTPUT"
  audit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit year
        run: python scripts/audit.py ${{ matrix.year }}
      - name: Commit report
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit
          git diff --cached --quiet && exit 0
          git commit -m "Audit normal ${{ matrix.year }}"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done
          exit 1
