<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สถิติหวยฮานอย</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: single column tool. Controls bar, tab strip, one panel at a time. Numbers in mono, Thai text in Plex Sans Thai. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface2:#e9eeec; --fg:#17211f; --muted:#5a6a66;
  --line:#d3dbd8; --accent:#0d6b5c; --accent-fg:#ffffff;
  --good:#1a7f4b; --bad:#b4322a; --warn-bg:#fbf1d6; --warn-fg:#6b4e00;
  --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#172220; --surface2:#1f2e2b; --fg:#e4ede9; --muted:#8fa39d;
  --line:#2c3d39; --accent:#4fc2ac; --accent-fg:#06201b;
  --good:#58c98b; --bad:#ef7a70; --warn-bg:#3a3014; --warn-fg:#f0d98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#172220; --surface2:#1f2e2b; --fg:#e4ede9; --muted:#8fa39d;
  --line:#2c3d39; --accent:#4fc2ac; --accent-fg:#06201b;
  --good:#58c98b; --bad:#ef7a70; --warn-bg:#3a3014; --warn-fg:#f0d98a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 8px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.disclaimer{background:var(--surface2);border-left:3px solid var(--accent);padding:10px 14px;font-size:.9rem;border-radius:0 6px 6px 0}
.warn{background:var(--warn-bg);color:var(--warn-fg);padding:10px 14px;border-radius:6px;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
select,input[type=date],input[type=number]{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{width:100px;font-family:var(--mono)}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.file{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:var(--surface);font-size:.9rem;cursor:pointer}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);white-space:nowrap;font-size:.95rem}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.panel{display:flex;flex-direction:column;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.tile .k{font-size:.78rem;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.tile .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.dec{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:200px;position:relative;padding-top:20px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col .b{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.col .c{font-family:var(--mono);font-size:.72rem;margin-bottom:3px;color:var(--fg)}
.declabels{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:6px}
.declabels span{font-family:var(--mono);font-size:.7rem;text-align:center;color:var(--muted)}
.expline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg);opacity:.55;pointer-events:none}
.expline span{position:absolute;left:0;top:-18px;z-index:2;font-size:.72rem;background:var(--surface);padding:0 4px;color:var(--muted)}
.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dbtn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 0;font-family:var(--mono);font-size:1.05rem;color:var(--fg)}
.dbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.9rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.78rem}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font)}
tr.sel td{background:var(--surface2)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cell{border-radius:4px;padding:4px 0;text-align:center;font-family:var(--mono);line-height:1.15;min-width:0;border:1px solid var(--line)}
.cell b{display:block;font-weight:500;font-size:.78rem}
.cell i{display:block;font-style:normal;font-size:.68rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
@media (max-width:520px){.cell b{font-size:.7rem}.cell i{display:none}.col .c{font-size:.6rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>สถิติหวยฮานอย</h1>
      <p class="muted" id="meta"></p>
    </div>
    <label class="file" tabindex="-1">โหลดไฟล์ CSV ใหม่<input type="file" id="csv" accept=".csv,text/csv"></label>
  </div>

  <p class="disclaimer">ใช้ดูสถิติย้อนหลังเท่านั้น ผลแต่ละงวดไม่ขึ้นกับงวดก่อนหน้า สถิติจึงทำนายงวดต่อไปไม่ได้ และไม่มีวิธีแทงใดที่ทำให้ค่าคาดหวังเป็นบวกได้ถ้าอัตราจ่ายต่ำกว่าส่วนกลับของความน่าจะเป็น</p>

  <div id="status" class="box" style="margin-bottom:14px"></div>

  <div class="bar">
    <label>รอบ
      <select id="src">
        <optgroup label="รอบที่เล่น"><option value="normal">ปกติ (ผลทางการ)</option><option value="vip">VIP</option></optgroup>
        <optgroup label="รอบอ้างอิง (ไม่ได้เล่น)"><option value="adhoc">เฉพาะกิจ</option><option value="redcross">กาชาด</option><option value="special">พิเศษ</option></optgroup>
      </select></label>
    <label>เลขที่ใช้
      <select id="field"><option value="b">ล่าง 2 ตัว</option><option value="t2">บน 3 ตัว (เอา 2 ตัวท้าย)</option></select></label>
    <label>ตั้งแต่<input type="date" id="from"></label>
    <label>ถึง<input type="date" id="to"></label>
  </div>

  <div id="notes"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-t="ov">ภาพรวม</button>
    <button class="tab" role="tab" data-t="rud">รูด</button>
    <button class="tab" role="tab" data-t="freq">ความถี่ 00-99</button>
    <button class="tab" role="tab" data-t="calc">คำนวณรูด</button>
    <button class="tab" role="tab" data-t="seq">ลำดับและการซ้ำ</button>
    <button class="tab" role="tab" data-t="x">ข้ามรอบ</button>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script>
const RAW=[];
const SRC={normal:'ปกติ',vip:'VIP',adhoc:'เฉพาะกิจ',redcross:'กาชาด',special:'พิเศษ'};
const $=id=>document.getElementById(id);
let DATA=RAW.map(r=>({s:r[0],d:r[1],t:r[2],b:r[3]}));
const st={src:'normal',field:'b',from:'',to:'',tab:'ov',digit:6,inc0:true,payout:80,stake:1,loaded:'ยังไม่ได้โหลดข้อมูล'};

/* ---------- statistics helpers ---------- */
function lgamma(z){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);
  z-=1;let x=c[0];for(let i=1;i<g+2;i++)x+=c[i]/(z+i);const t=z+g+0.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x)}
function gser(a,x){let ap=a,sum=1/a,del=sum;for(let n=0;n<500;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-12)break}return sum*Math.exp(-x+a*Math.log(x)-lgamma(a))}
function gcf(a,x){let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-12)break}return Math.exp(-x+a*Math.log(x)-lgamma(a))*h}
function chiP(x,k){if(x<=0)return 1;const a=k/2,xx=x/2;return xx<a+1?1-gser(a,xx):gcf(a,xx)}
function normP2(z){z=Math.abs(z);const t=1/(1+0.2316419*z),d=0.3989423*Math.exp(-z*z/2);return 2*d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))))}
function chiSq(counts,expEach){let x=0;for(const c of counts)x+=(c-expEach)*(c-expEach)/expEach;return {x,p:chiP(x,counts.length-1),df:counts.length-1}}
const fmtP=p=>p<0.001?'< 0.001':p.toFixed(3);
const fmtN=n=>n.toLocaleString('en-US');
const fmtM=n=>(n>0?'+':n<0?'−':'')+Math.abs(Math.round(n*100)/100).toLocaleString('en-US');
const pad2=n=>String(n).padStart(2,'0');

/* ---------- data access ---------- */
function val(r,f){return parseInt(f==='b'?r.b:r.t.slice(-2),10)}
function rowsFor(src,from,to,f){
  return DATA.filter(r=>r.s===src&&(!from||r.d>=from)&&(!to||r.d<=to)).sort((a,b)=>a.d<b.d?-1:1).map(r=>({d:r.d,v:val(r,f)}));
}
function bounds(src){const ds=DATA.filter(r=>r.s===src).map(r=>r.d).sort();return ds.length?[ds[0],ds[ds.length-1]]:['','']}
function cur(){return rowsFor(st.src,st.from,st.to,st.field)}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

/* ---------- panels ---------- */
function counts100(rows){const c=new Array(100).fill(0);for(const r of rows)c[r.v]++;return c}

function ovPanel(rows){
  const n=rows.length, c=counts100(rows);
  const dec=new Array(10).fill(0);for(let i=0;i<100;i++)dec[Math.floor(i/10)]+=c[i];
  const expD=n/10, max=Math.max(...dec,expD)*1.18||1;
  const ch100=chiSq(c,n/100), chDec=chiSq(dec,expD);
  const verdict=p=>p<0.05?'ต่างจากการสุ่มสม่ำเสมออย่างมีนัยสำคัญ':'ไม่ต่างจากการสุ่มสม่ำเสมอ';
  const small=n/100<5;
  const last=rows.slice(-12).reverse();
  let bars='';
  dec.forEach((v,i)=>{bars+=`<div class="col"><span class="c">${v}</span><div class="b" style="height:${(v/max*100).toFixed(1)}%"></div></div>`});
  let lab='';for(let i=0;i<10;i++)lab+=`<span>${pad2(i*10)}-${pad2(i*10+9)}</span>`;
  const top=expD/max*100;
  return `
  <div class="tiles">
    <div class="tile"><div class="k">จำนวนงวด</div><div class="v">${fmtN(n)}</div><div class="s">${rows.length?rows[0].d+' ถึง '+rows[n-1].d:'ไม่มีข้อมูลในช่วงนี้'}</div></div>
    <div class="tile"><div class="k">chi-square 100 เลข</div><div class="v">p = ${n?fmtP(ch100.p):'-'}</div><div class="s">${n?(small?'ข้อมูลน้อยเกินไป ผลไม่น่าเชื่อถือ':verdict(ch100.p)):''}</div></div>
    <div class="tile"><div class="k">chi-square 10 กลุ่ม</div><div class="v">p = ${n?fmtP(chDec.p):'-'}</div><div class="s">${n?(expD<5?'ข้อมูลน้อยเกินไป ผลไม่น่าเชื่อถือ':verdict(chDec.p)):''}</div></div>
    <div class="tile"><div class="k">เลขที่ออกซ้ำมากสุด</div><div class="v">${n?(()=>{const m=Math.max(...c);const i=c.indexOf(m);return pad2(i)+' ('+m+' ครั้ง)'})():'-'}</div><div class="s">ค่าเฉลี่ยที่ควรเป็น ${(n/100).toFixed(1)} ครั้งต่อเลข</div></div>
  </div>
  <div class="box">
    <h2>จำนวนครั้งที่ออกในแต่ละกลุ่มสิบ</h2>
    <div class="dec">${bars}<div class="expline" style="bottom:${(top*1.8).toFixed(1)}px"><span>ควรเป็น ${expD.toFixed(1)}</span></div></div>
    <div class="declabels">${lab}</div>
  </div>
  <div class="box">
    <h2>ผลล่าสุด 12 งวด</h2>
    <div class="tbl"><table><thead><tr><th>วันที่</th><th>เลข</th></tr></thead><tbody>${last.map(r=>`<tr><td class="mono">${r.d}</td><td>${pad2(r.v)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

function rudSet(d,inc0){const s=[];for(let n=0;n<100;n++){const a=Math.floor(n/10),b=n%10;
  if(a===d||b===d){ if(!inc0&&d!==0&&((a===0&&b===d)||(b===0&&a===d)))continue; s.push(n)}}return s}
function rudStats(rows,d){
  const set=new Set(rudSet(d,st.inc0)), k=set.size, stake=st.stake, pay=st.payout;
  let hits=0,miss=0,maxMiss=0,pl=0;const cum=[0];
  for(const r of rows){const h=set.has(r.v);if(h){hits++;miss=0;pl+=pay*stake-k*stake}else{miss++;if(miss>maxMiss)maxMiss=miss;pl-=k*stake}cum.push(pl)}
  const n=rows.length,p=k/100;
  const z=n?(hits-n*p)/Math.sqrt(n*p*(1-p)):0;
  return {k,hits,n,rate:n?hits/n:0,p,z,pv:n?normP2(z):1,miss,maxMiss,pl,cum,ev:p*pay*stake-k*stake,set:[...set]};
}
function niceStep(range,ticks){const raw=range/ticks,m=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/m;return (f<1.5?1:f<3?2:f<7?5:10)*m}
function plChart(cum,evPer){
  const W=640,H=240,L=58,R=14,T=12,B=26,n=cum.length-1;
  if(n<1)return '<p class="muted">ไม่มีข้อมูลในช่วงนี้</p>';
  const expEnd=evPer*n;
  let lo=Math.min(0,...cum,expEnd),hi=Math.max(0,...cum,expEnd);
  if(hi===lo){hi+=1;lo-=1}
  const step=niceStep(hi-lo,5);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const X=i=>L+(W-L-R)*i/n, Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const pts=[];const stride=Math.max(1,Math.floor(n/700));
  for(let i=0;i<=n;i+=stride)pts.push(X(i).toFixed(1)+','+Y(cum[i]).toFixed(1));
  if((n%stride)!==0)pts.push(X(n).toFixed(1)+','+Y(cum[n]).toFixed(1));
  let grid='';for(let v=lo;v<=hi+1e-9;v+=step){const y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${Math.abs(v)<1e-9?1.6:1}" fill="none"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v).toLocaleString('en-US')}</text>`}
  const xl=[0,Math.round(n/2),n].map((i,j)=>`<text x="${X(i)}" y="${H-8}" text-anchor="${j===0?'start':j===2?'end':'middle'}">งวดที่ ${i}</text>`).join('');
  const endC=cum[n]>=0?'var(--good)':'var(--bad)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟกำไรขาดทุนสะสม">${grid}${xl}
   <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(expEnd)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
   <circle cx="${X(n)}" cy="${Y(cum[n])}" r="4" fill="${endC}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
}
function rudPanel(rows){
  const s=rudStats(rows,st.digit), n=rows.length;
  let btns='';for(let d=0;d<10;d++)btns+=`<button class="dbtn" data-d="${d}" aria-pressed="${d===st.digit}">${d}</button>`;
  const all=[];for(let d=0;d<10;d++)all.push([d,rudStats(rows,d)]);
  const evPct=s.k?(s.ev/(s.k*st.stake)*100):0;
  return `
  <div class="box">
    <h2>เลือกเลขรูด</h2>
    <div class="digits">${btns}</div>
    <div class="opts" style="margin-top:12px">
      <label>แทงเลขละ (บาท)<input type="number" id="stake" min="0.01" step="any" value="${st.stake}"></label>
      <label>ถูกแล้วได้เงินรวม (บาท ต่อเลขละ 1 บาท)<input type="number" id="payout" min="1" step="any" value="${st.payout}"></label>
      ${st.digit!==0?`<label class="chk"><input type="checkbox" id="inc0" ${st.inc0?'checked':''}> รวมเลขที่มี 0 คู่ (0${st.digit}, ${st.digit}0)</label>`:''}
    </div>
    <p class="muted mono" style="margin-top:10px;font-size:.85rem;overflow-wrap:anywhere">รูด ${st.digit} = ${s.k} เลข: ${s.set.map(pad2).join(' ')}</p>
  </div>
  <div class="tiles">
    <div class="tile"><div class="k">โอกาสถูกงวดหน้า</div><div class="v">${(s.p*100).toFixed(0)}%</div><div class="s">คงที่ทุกงวด ทุกเลขรูด ไม่ขึ้นกับผลย้อนหลัง</div></div>
    <div class="tile"><div class="k">ย้อนหลังที่ผ่านมา ถูกกี่งวด</div><div class="v">${fmtN(s.hits)} / ${fmtN(n)}</div><div class="s">${(s.rate*100).toFixed(1)}% (ค่าที่ควรเป็น ${(s.p*100).toFixed(0)}%) เป็นแค่ผลบังเอิญของช่วงนี้</div></div>

function lchoose(n,k){return lgamma(n+1)-lgamma(k+1)-lgamma(n-k+1)}
function binomP(k,n,p){if(n<=0)return 1;let lo=0,hi=0;
  for(let i=0;i<=n;i++){const pm=Math.exp(lchoose(n,i)+i*Math.log(p)+(n-i)*Math.log(1-p));if(i<=k)lo+=pm;if(i>=k)hi+=pm}
  return Math.min(1,2*Math.min(lo,hi))}
function seqPanel(rows){
  const n=rows.length;
  if(n<30)return '<div class="box"><p class="muted">ข้อมูลน้อยเกินไปสำหรับทดสอบลำดับ (ต้องมีอย่างน้อย 30 งวด)</p></div>';
  const v=rows.map(r=>r.v);
  let m=0,same=0,m2=0,rev=0,st2=0,su=0;
  for(let i=1;i<n;i++){
    if(dayDiff(rows[i-1].d,rows[i].d)!==1)continue;
    m++;const a=v[i-1],b=v[i];
    if(a===b)same++;
    if(a%11!==0){m2++;if(b===(a%10)*10+Math.floor(a/10))rev++}
    if(Math.floor(a/10)===Math.floor(b/10))st2++;
    if(a%10===b%10)su++;
  }
  const tests=[];
  tests.push(['วันถัดไปออกเลขเดิมซ้ำ',same,m*0.01,binomP(same,m,0.01),m]);
  tests.push(['วันถัดไปออกเลขกลับ (เช่น 37 แล้ว 73)',rev,m2*0.01,binomP(rev,m2,0.01),m2]);
  tests.push(['วันถัดไปหลักสิบเท่าเดิม',st2,m*0.1,binomP(st2,m,0.1),m]);
  tests.push(['วันถัดไปหลักหน่วยเท่าเดิม',su,m*0.1,binomP(su,m,0.1),m]);
  for(const k of [2,5,10,20]){
    let c=0;const nk=n-k;
    for(let i=k;i<n;i++){for(let j=1;j<=k;j++){if(v[i]===v[i-j]){c++;break}}}
    const p=1-Math.pow(0.99,k);
    tests.push([`เลขซ้ำกับที่ออกใน ${k} งวดก่อนหน้า`,c,nk*p,binomP(c,nk,p),nk]);
  }
  const last={};let minGap=Infinity;
  for(let i=0;i<n;i++){if(v[i] in last){minGap=Math.min(minGap,i-last[v[i]])}last[v[i]]=i}
  const verdict=p=>p<0.001?'<span class="neg">ผิดปกติชัดเจน</span>':p<0.01?'น่าสงสัย':'ปกติ';
  const rowsHtml=tests.map(t=>`<tr><td>${t[0]}</td><td>${fmtN(t[1])}</td><td>${t[2].toFixed(1)}</td><td>${fmtP(t[3])}</td><td style="font-family:var(--font)">${verdict(t[3])}</td></tr>`).join('');
  const W=isFinite(minGap)?minGap-1:n;
  const expW=W>=1?(n-W)*(1-Math.pow(0.99,W)):0;
  let edge='';
  if(W>=2&&expW>=8&&W<n){
    const evN=st.payout/100-1,evK=st.payout/(100-W)-1;
    edge=`<div class="box"><h2>เลขซ้ำห่างน้อยที่สุดคือ ${minGap} งวด</h2>
    <p>ไม่มีเลขใดออกซ้ำภายใน ${W} งวด เลย ทั้งที่ถ้าสุ่มจริงควรมีประมาณ ${expW.toFixed(0)} ครั้ง ลักษณะนี้บ่งว่ารอบนี้อาจสร้างจากโปรแกรมที่เลี่ยงเลขที่เพิ่งออก ไม่ใช่การสุ่มจริง</p>
    <p class="muted" style="margin-top:8px;font-size:.9rem">ถ้าเลขที่ออกใน ${W} งวดล่าสุดไม่ออกซ้ำจริง เลขที่เหลือ ${100-W} ตัวมีโอกาสตัวละ ${(100/(100-W)).toFixed(2)}% แทน 1% ที่อัตราจ่าย ${st.payout} ต่อ 1 ค่าคาดหวังต่อ 1 บาทจึงเป็น <b class="${evK>=0?'pos':'neg'}">${fmtM(evK*100)}%</b> เทียบกับ ${fmtM(evN*100)}% ถ้าไม่รู้ pattern นี้</p></div>`;
  }else{
    edge=`<div class="box"><p class="muted">เลขซ้ำห่างน้อยที่สุดคือ ${isFinite(minGap)?minGap+' งวด':'ไม่มีเลขซ้ำเลย'} ซึ่งอยู่ในช่วงที่การสุ่มปกติทำให้เกิดได้</p></div>`;
  }
  return `<div class="box"><h2>ทดสอบว่าลำดับผลของรอบ ${SRC[st.src]} เป็นการสุ่มหรือไม่</h2>
    <p class="muted" style="margin-bottom:10px;font-size:.88rem">เทียบจำนวนครั้งที่เกิดจริงกับที่ควรเกิดถ้าแต่ละงวดสุ่มเป็นอิสระ ใช้เกณฑ์ p &lt; 0.001 เพราะทดสอบหลายข้อพร้อมกัน ข้อที่ผ่านเกณฑ์จึงน่าเชื่อกว่าความบังเอิญ</p>
    <div class="tbl"><table><thead><tr><th>ข้อทดสอบ</th><th>เกิดจริง</th><th>ควรเกิด</th><th>p</th><th>ผล</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></div>${edge}`;
}

function calcCore(rows){
  const n=rows.length,D=[...Array(10).keys()];
  const sets=D.map(d=>new Set(rudSet(d,st.inc0)));
  const H=D.map(d=>rows.map(r=>sets[d].has(r.v)?1:0));
  const P=H.map(h=>{const p=[0];for(const x of h)p.push(p[p.length-1]+x);return p});
  const norm=a=>{const mn=Math.min(...a),mx=Math.max(...a);return a.map(x=>mx>mn?(x-mn)/(mx-mn)*100:50)};
  const feat=(t,w)=>D.map(d=>({w:w[d],r10:(P[d][t]-P[d][Math.max(0,t-10)])/Math.min(10,t||1),r30:(P[d][t]-P[d][Math.max(0,t-30)])/Math.min(30,t||1),r100:(P[d][t]-P[d][Math.max(0,t-100)])/Math.min(100,t||1)}));
  const score=f=>{const a=norm(f.map(x=>x.w)),b=norm(f.map(x=>x.r30)),c=norm(f.map(x=>x.r100)),e=norm(f.map(x=>x.r10));return D.map(i=>(a[i]+b[i]+c[i]+e[i])/4)};
  const w=D.map(()=>0);const bt={top:0,bot:0,cnt:0,rnd:0};
  for(let t=0;t<n;t++){
    if(t>=100){const s=score(feat(t,w));let top=0,bot=0;for(const i of D){if(s[i]>s[top])top=i;if(s[i]<s[bot])bot=i}
      bt.cnt++;bt.top+=H[top][t];bt.bot+=H[bot][t]}
    for(const d of D)w[d]=w[d]*0.97+H[d][t];
  }
  const f=feat(n,w),s=score(f);
  const since=D.map(d=>{let k=0;for(let i=n-1;i>=0&&!H[d][i];i--)k++;return k});
  return {f,s,since,bt,k:sets[0].size,n};
}
function calcPanel(rows){
  if(rows.length<130)return `<div class="box"><p class="warn">ต้องมีข้อมูลอย่างน้อย 130 งวดจึงจะคำนวณและทดสอบย้อนหลังได้ รอบนี้มี ${rows.length} งวด</p></div>`;
  const c=calcCore(rows),p=c.k/100,N=c.bt.cnt,pay=st.payout,stake=st.stake;
  const order=[...Array(10).keys()].sort((a,b)=>c.s[b]-c.s[a]);
  const tr=order.map((d,i)=>`<tr><td>#${i+1} รูด ${d}</td><td>${c.s[d].toFixed(1)}</td><td>${(c.f[d].r10*100).toFixed(0)}%</td><td>${(c.f[d].r30*100).toFixed(0)}%</td><td>${(c.f[d].r100*100).toFixed(0)}%</td><td>${c.since[d]} งวด</td></tr>`).join('');
  const line=(name,h)=>{const z=(h-N*p)/Math.sqrt(N*p*(1-p)),pl=h*pay*stake-N*c.k*stake;
    return `<tr><td>${name}</td><td>${fmtN(h)} / ${fmtN(N)}</td><td>${(h/N*100).toFixed(2)}%</td><td>${fmtP(normP2(z))}</td><td class="${pl>=0?'pos':'neg'}">${pl>=0?'+':''}${fmtN(Math.round(pl))}</td></tr>`};
  const exp=N*p;
  return `<div class="box"><h2>คะแนนรูดแต่ละหลัก (แบบเดียวกับเครื่องมือจัดอันดับเลข)</h2>
    <p class="muted" style="margin-bottom:10px;font-size:.88rem">รวมความใหม่ (น้ำหนักลดลง 3% ต่องวด) กับอัตราถูกใน 10/30/100 งวดล่าสุด แล้วจัดเป็นคะแนน 0–100 <b>คะแนนนี้ไม่ใช่ความน่าจะเป็น</b> ความน่าจะเป็นถูกงวดหน้าของทุกหลักคือ ${(p*100).toFixed(0)}% เท่ากัน</p>
    <div class="tbl"><table><thead><tr><th>อันดับ</th><th>คะแนน</th><th>10 งวด</th><th>30 งวด</th><th>100 งวด</th><th>ไม่ถูกมาแล้ว</th></tr></thead><tbody>${tr}</tbody></table></div></div>
  <div class="box" style="margin-top:14px"><h2>ทดสอบย้อนหลังว่าคะแนนนี้ได้เปรียบหรือไม่</h2>
    <p class="muted" style="margin-bottom:10px;font-size:.88rem">ทุกงวดตั้งแต่งวดที่ 101 คำนวณคะแนนจากข้อมูลก่อนหน้างวดนั้นเท่านั้น แล้วแทงรูดหลักอันดับ 1 (และอันดับสุดท้ายเทียบ) แทงละ ${stake} บาท ${c.k} เลข จ่าย ${pay} บาท</p>
    <div class="tbl"><table><thead><tr><th>วิธีเลือก</th><th>ถูก/งวด</th><th>อัตราถูก</th><th>p เทียบ ${(p*100).toFixed(0)}%</th><th>กำไร(ขาดทุน) บาท</th></tr></thead><tbody>
      ${line('รูดอันดับ 1',c.bt.top)}${line('รูดอันดับสุดท้าย',c.bt.bot)}
      <tr><td>สุ่ม (ที่คาดไว้)</td><td>${fmtN(Math.round(exp))} / ${fmtN(N)}</td><td>${(p*100).toFixed(2)}%</td><td>-</td><td class="neg">${fmtN(Math.round(exp*pay*stake-N*c.k*stake))}</td></tr></tbody></table></div>
    <p style="margin-top:10px">${Math.abs(c.bt.top-exp)<2*Math.sqrt(N*p*(1-p))?'อันดับ 1 ถูกใกล้เคียงการสุ่ม คะแนนนี้ไม่ได้ช่วยให้ได้เปรียบ':(c.bt.top>exp?'อันดับ 1 ถูกมากกว่าสุ่มอย่างมีนัยสำคัญ ต้องตรวจซ้ำกับข้อมูลชุดอื่นก่อนเชื่อ':'อันดับ 1 ถูกน้อยกว่าสุ่ม')} และไม่ว่าจะถูกกี่เปอร์เซ็นต์ ถ้าไม่ถึง 25% (เท่ากับจ่าย 100 เท่า) ก็ยังขาดทุนเฉลี่ยตามค่าคาดหวัง</p></div>`;
}
function render(){
  const rows=cur();
  renderStatus();
  notes(rows);
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===st.tab));
  const html=st.tab==='ov'?ovPanel(rows):st.tab==='rud'?rudPanel(rows):st.tab==='freq'?freqPanel(rows):st.tab==='seq'?seqPanel(rows):st.tab==='calc'?calcPanel(rows):xPanel();
  $('panel').innerHTML=html;
  const ld=DATA.filter(r=>r.s==='normal').map(r=>r.d).sort().pop();$('meta').textContent=`${fmtN(DATA.length)} แถว จาก ${st.loaded}`+(ld?` · รอบปกติล่าสุด ${ld}`:'');
}
function resetRange(){const [a,b]=bounds(st.src);st.from=a;st.to=b;$('from').value=a;$('to').value=b}

$('src').addEventListener('change',e=>{st.src=e.target.value;resetRange();render()});
$('field').addEventListener('change',e=>{st.field=e.target.value;render()});
$('from').addEventListener('change',e=>{st.from=e.target.value;render()});
$('to').addEventListener('change',e=>{st.to=e.target.value;render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){st.tab=b.dataset.t;render()}});
$('panel').addEventListener('click',e=>{const b=e.target.closest('.dbtn');if(b){st.digit=+b.dataset.d;render()}});
$('panel').addEventListener('change',e=>{
  if(e.target.id==='stake'){const v=parseFloat(e.target.value);if(v>0){st.stake=v;render()}}
  else if(e.target.id==='payout'){const v=parseFloat(e.target.value);if(v>0){st.payout=v;render()}}
  else if(e.target.id==='inc0'){st.inc0=e.target.checked;render()}
});
function parseCsv(text,name){
  const lines=String(text).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);
  const h=lines[0].split(',');const ix=n=>h.indexOf(n);
  const is=ix('source'),id=ix('draw_date'),it=ix('top3'),ib=ix('bottom2');const ifa=ix('fetched_at');
  if([is,id,it,ib].some(i=>i<0)){$('notes').innerHTML='<p class="warn">ไฟล์นี้ไม่มีคอลัมน์ source, draw_date, top3, bottom2</p>';return false}
  const out=[];
  for(let i=1;i<lines.length;i++){const c=lines[i].split(',');
    if(/^\d{3}$/.test(c[it])&&/^\d{2}$/.test(c[ib])&&SRC[c[is]])out.push({s:c[is],d:c[id],t:c[it],b:c[ib],f:ifa>=0?c[ifa]:''})}
  if(!out.length){$('notes').innerHTML='<p class="warn">ไม่พบแถวที่อ่านได้ในไฟล์นี้</p>';return false}
  DATA=out;st.loaded='ไฟล์ '+name;resetRange();render();return true;
}
$('csv').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>parseCsv(rd.result,f.name);rd.readAsText(f);
});
resetRange();render();
fetch('data/status.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{RUN=j;renderStatus()}).catch(()=>{});
fetch('data/hanoi_lottery.csv',{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(x=>parseCsv(x,'data/hanoi_lottery.csv'))
  .catch(()=>{$('notes').innerHTML='<p class="warn">ยังไม่พบไฟล์ data/hanoi_lottery.csv ในที่เดียวกับหน้านี้ ให้กด "โหลดไฟล์ CSV ใหม่" เพื่อเลือกไฟล์เอง</p>'});
</script>
